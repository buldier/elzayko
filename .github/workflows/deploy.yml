name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Re-run the starter-content seed after deploying (resets seeded categories/collections to their sample values)"
        type: boolean
        default: false

# One production deploy at a time; a newer push waits for the running one.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/app_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/app_test?schema=public
      SITE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: ./storage
      EMAIL_DRIVER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship and build on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # The server key only allows "deploy <app>" / "seed <app>" (see deploy/ci-entry.sh).
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" "deploy ${{ github.event.repository.name }}"
      - name: Seed starter content
        if: ${{ inputs.seed }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" "seed ${{ github.event.repository.name }}" < /dev/null
      - name: Check the live site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 -o /dev/null "https://${{ github.event.repository.name }}.com/"
